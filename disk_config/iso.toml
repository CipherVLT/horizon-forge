# bootc-image-builder config for the Anaconda ISO.
# Build disk images workflow replaces GHCR_IMAGE with the variant you pick
# (bazzite-horizon or bazzite-horizon-nvidia) before the installer is built.
# `just cook-iso` does the same replacement locally.
#
# The disk gets the bootloader Anaconda installs for a bootc payload
# (bootupd's GRUB). Do not add `bootloader --sdboot` here: Anaconda rejects it
# for this payload ("Systemd-boot cannot be utilized with the current type of
# payload"), because it only supports systemd-boot on package (DNF) installs.
#
# systemd-boot is added after install instead, from the booted system:
# bazzite-horizon-sdboot-sync.service (enabled in the image) copies the
# running ostree deployment's kernel, initrd and kernel line onto the ESP and
# runs `bootctl install`. GRUB stays on the ESP as a fallback entry in the
# firmware boot menu.
#
# The USB stick that boots the installer is GRUB too. That menu is the ISO's
# El Torito image, not the bootloader that lands on disk.

[customizations.installer.kickstart]
contents = """
# --log lands in the installed system so the install can be checked later:
# sudo cat /var/roothome/horizon-post.log
network --hostname=bazzite

%post --erroronfail --log=/root/horizon-post.log
set -x
bootc switch --mutate-in-place --transport registry GHCR_IMAGE

# When the EFI partition is reused instead of reformatted, an earlier
# install of this image leaves its systemd-boot and bazzite-horizon entry
# behind. The firmware keeps booting that stale entry, which points at a
# deployment that no longer exists, and lands in emergency mode with
# "Couldn't find specified OSTree root". Strip it so the GRUB this install
# wrote is the only loader on the disk. bazzite-horizon-sdboot-sync.service
# re-adds systemd-boot on first boot from a kernel line that is known good.
rm -rf /boot/efi/loader /boot/efi/bazzite-horizon
if command -v bootctl >/dev/null 2>&1; then
    bootctl --esp-path=/boot/efi remove || true
fi
ls -R /boot/efi/EFI || true

# Record the boot state the installer left behind.
findmnt -no SOURCE,FSTYPE,OPTIONS / /boot /boot/efi /sysroot || true
ls -l /boot/loader || true
cat /boot/loader/entries/*.conf || true
ls -d /sysroot/ostree/boot.*/*/*/* || true
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
