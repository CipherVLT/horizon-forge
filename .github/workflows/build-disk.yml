---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which image to install from the ISO"
        required: true
        default: bazzite-horizon
        type: choice
        options:
          - bazzite-horizon
          - bazzite-horizon-nvidia
      upload-to-s3:
        description: "Publish the ISO to Cloudflare R2 (needs the R2 secrets)"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/disk.toml'
      - 'disk_config/iso.toml'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    runs-on: ${{ (inputs.platform || 'amd64') == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["qcow2", "anaconda-iso"]
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${{ inputs.variant || 'bazzite-horizon' }}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Point the ISO at this variant
        run: |
          set -euo pipefail
          sed -i "s|GHCR_IMAGE|${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}|g" disk_config/iso.toml
          grep -n "${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}" disk_config/iso.toml

      - name: Build disk images
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p output
          echo "$GH_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          sudo podman pull "${BIB_IMAGE}"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo mount --make-rshared /
          CONFIG="./disk_config/disk.toml"
          if [[ "${DISK_TYPE}" == "anaconda-iso" ]]; then
            CONFIG="./disk_config/iso.toml"
          fi
          sudo podman run --rm --privileged --security-opt label=disable --security-opt apparmor=unconfined --security-opt seccomp=unconfined \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --volume "$PWD/output:/output" \
            --volume "$PWD/${CONFIG}:/config.toml:ro" \
            "${BIB_IMAGE}" \
            build \
            --output /output \
            --chown "${USER_UID}:${USER_GID}" \
            --use-librepo=True \
            --rootfs btrfs \
            --type "${DISK_TYPE}" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          echo "output-directory=output" >> "$GITHUB_OUTPUT"

      - name: Upload disk images and Checksum to Job Artifacts
        if: github.event_name != 'pull_request' && (inputs.upload-to-s3 != true || matrix.disk-type != 'anaconda-iso')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.disk-type }}-${{ inputs.variant || 'bazzite-horizon' }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
      
      - name: Upload ISO to Cloudflare R2
        if: inputs.upload-to-s3 == true && matrix.disk-type == 'anaconda-iso' && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          set -euo pipefail
          for v in R2_ACCOUNT_ID R2_BUCKET RCLONE_CONFIG_R2_ACCESS_KEY_ID RCLONE_CONFIG_R2_SECRET_ACCESS_KEY; do
            if [[ -z "${!v}" ]]; then
              echo "::error::Missing ${v}. Add the R2 secrets described in the README (Publishing ISOs)."
              exit 1
            fi
          done

          iso=$(find "${SOURCE_DIR}" -type f -name install.iso -print -quit)
          if [[ -z "${iso}" ]]; then
            echo "::error::No install.iso under ${SOURCE_DIR}"
            exit 1
          fi

          # Stable names, so the README can link to them permanently.
          # Each upload replaces the previous ISO for that image.
          name="${IMAGE_NAME}-latest.iso"
          stage=$(mktemp -d)
          mv "${iso}" "${stage}/${name}"
          (cd "${stage}" && sha256sum "${name}" > "${name}.sha256")
          cat "${stage}/${name}.sha256"

          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copyto "${stage}/${name}" "R2:${R2_BUCKET}/${name}" \
            --s3-chunk-size 100M --s3-upload-concurrency 8 --stats 30s --stats-one-line
          rclone copyto "${stage}/${name}.sha256" "R2:${R2_BUCKET}/${name}.sha256"

          {
            echo "### ISO published to Cloudflare R2"
            echo
            if [[ -n "${R2_PUBLIC_URL}" ]]; then
              echo "- ${R2_PUBLIC_URL%/}/${name}"
              echo "- ${R2_PUBLIC_URL%/}/${name}.sha256"
            else
              echo "Uploaded \`${name}\` to bucket \`${R2_BUCKET}\`. Set the repository variable R2_PUBLIC_URL to print download links here."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
