---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build ${{ matrix.image_name }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # One compositor per image, like Bazzite's KDE and GNOME images.
          - image_name: bazzite-horizon
            base_image: ghcr.io/ublue-os/bazzite:stable
            desktop: hyprland
          - image_name: bazzite-horizon-nvidia
            base_image: ghcr.io/ublue-os/bazzite-nvidia-open:stable
            desktop: hyprland
          - image_name: bazzite-horizon-mango
            base_image: ghcr.io/ublue-os/bazzite:stable
            desktop: mango
          - image_name: bazzite-horizon-mango-nvidia
            base_image: ghcr.io/ublue-os/bazzite-nvidia-open:stable
            desktop: mango

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          echo "IMAGE_NAME=${{ matrix.image_name }}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # Build only on a known, unmodified Bazzite: resolve the tag to one
      # digest, check Universal Blue's signature on that digest, and require
      # the Fedora release in build_files/bazzite-fedora.ref. The build then
      # uses that exact digest, so the image checked is the image built on.
      #
      # The signature is checked by hand: Bazzite signs with its key
      # (build_files/bazzite-cosign.pub, from github.com/ublue-os/bazzite) in
      # cosign's older format, and `cosign verify` (2.6 and 3.x) rejects that
      # signature with "expected key signature, not certificate" even though
      # the key matches. So: fetch the signature, check it against the key
      # with openssl, and check that the signed payload names this exact
      # digest in Bazzite's own repository.
      - name: Install Cosign 2 (fetch the base's signature)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.5'
          install-dir: ${{ runner.temp }}/cosign2

      - name: Verify the Bazzite base
        id: base
        env:
          BASE_TAG: ${{ matrix.base_image }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }
          want=$(grep -v -e '^#' -e '^[[:space:]]*$' build_files/bazzite-fedora.ref | tr -d '[:space:]')
          digest=$(skopeo inspect --retry-times 3 --no-tags --format '{{.Digest}}' "docker://${BASE_TAG}")
          repo="${BASE_TAG%:*}"
          ref="${repo}@${digest}"
          work=$(mktemp -d)
          "${RUNNER_TEMP}/cosign2/cosign" download signature "${ref}" > "${work}/sigs.jsonl"
          ok=0
          n=0
          while IFS= read -r line; do
            n=$((n + 1))
            jq -r '.Payload' <<<"${line}" | base64 -d > "${work}/payload.json"
            jq -r '.Base64Signature' <<<"${line}" | base64 -d > "${work}/sig.bin"
            if openssl dgst -sha256 -verify build_files/bazzite-cosign.pub \
                 -signature "${work}/sig.bin" "${work}/payload.json" >/dev/null 2>&1 &&
               [[ "$(jq -r '.critical.image["docker-manifest-digest"]' "${work}/payload.json")" == "${digest}" ]] &&
               [[ "$(jq -r '.critical.identity["docker-reference"]' "${work}/payload.json")" == "${repo}" ]]; then
              ok=1
              break
            fi
          done < "${work}/sigs.jsonl"
          if (( ! ok )); then
            echo "::error title=Bazzite base::none of the ${n} signature(s) on ${ref} is Universal Blue's"
            [[ -s "${work}/payload.json" ]] && jq -c '.critical' "${work}/payload.json" || true
            exit 1
          fi
          echo "Universal Blue's signature checks out for ${ref}"
          labels=$(skopeo inspect --retry-times 3 --no-tags --format '{{json .Labels}}' "docker://${ref}")
          version=$(jq -r '."org.opencontainers.image.version" // ""' <<<"${labels}")
          kernel=$(jq -r '."ostree.linux" // ""' <<<"${labels}")
          echo "Base ${ref}: version ${version}, kernel ${kernel}"
          if [[ "${version%%.*}" != "${want}" && "${kernel}" != *".fc${want}."* ]]; then
            echo "::error title=Bazzite base::${BASE_TAG} is version '${version}' (kernel '${kernel}'), not Fedora ${want}"
            exit 1
          fi
          {
            echo "### Base"
            echo "\`${ref}\` (Bazzite ${version}), signature verified"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      # This actually builds the container image
      - name: Build Image
        id: build-image
        env:
          BASE_IMAGE: ${{ steps.base.outputs.ref }}
          DESKTOP: ${{ matrix.desktop }}
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # Rechunk skipped: a second copy of Bazzite fills the runner disk.

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    just rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"
          # The Fedora release stream ("45", "45-<date>"): installs from the
          # ISO follow this tag, so they stay on Bazzite 45 until switched
          # by hand, even after :latest moves to a newer Fedora.
          fedora=$(grep -v -e '^#' -e '^[[:space:]]*$' build_files/bazzite-fedora.ref | tr -d '[:space:]')
          alias_tags="${alias_tags} ${fedora} ${fedora}-$(date +%Y%m%d)"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # Run this workflow by hand on a branch (Actions -> Build container image ->
      # Run workflow -> pick the branch) to publish that branch as the
      # `testing` tag only, without touching `latest`:
      #   sudo bootc switch ghcr.io/<owner>/<image>:testing     # try it
      #   sudo bootc switch ghcr.io/<owner>/<image>:latest      # go back
      - name: Push testing tag
        if: github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-testing
        run: |
          set -euox pipefail
          podman tag "${IMAGE_NAME}:${DEFAULT_TAG}" "${IMAGE_NAME}:testing"
          podman push --digestfile=/tmp/digestfile-testing "${IMAGE_NAME}:testing" "${IMAGE_REGISTRY}/${IMAGE_NAME}:testing"
          echo "digest=$(< /tmp/digestfile-testing)" >> "$GITHUB_OUTPUT"

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch')
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          if [[ -z "${COSIGN_PRIVATE_KEY}" ]]; then
            echo "SIGNING_SECRET is unset. Image was pushed unsigned."
            echo "Add the cosign private key as SIGNING_SECRET to sign later builds."
            exit 0
          fi
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

      - name: Sign testing image
        if: github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-testing.outputs.digest }}
        run: |
          if [[ -z "${COSIGN_PRIVATE_KEY}" ]]; then
            echo "SIGNING_SECRET is unset. Image was pushed unsigned."
            exit 0
          fi
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

