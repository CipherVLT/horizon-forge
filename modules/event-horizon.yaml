description: >
  ryzendew Event Horizon (Zig rewrite), built from the pinned commit in
  build_files/event-horizon.ref with Zig 0.16 for x86-64-v2 (portable,
  not tuned for the build machine), toolchain kept out of the final image.

depends:
  - hyprland-session

packages:
  - libjpeg-turbo
  - vulkan-loader
  - cairo
  - pango
  - freetype
  - fontconfig
  - libxkbcommon
  - glib2
  - sdbus-cpp
  - pipewire
  - pam
  - polkit
  - libcurl
  - openssl
  - libwebp
  - libpng
  - lz4
  - libdrm
  - librsvg2
  - ffmpegthumbnailer
  - jemalloc
  - lcms2
  - libarchive
  - poppler-glib
  - wayland
  - hicolor-icon-theme
  - adwaita-icon-theme

scripts:
  post: |
    # Implemented by build_files/build-event-horizon.sh in the image build.
    # Do not duplicate that compile here.
    test -x /usr/bin/horizon
    horizon --version
