# Bazzite Horizon default for kitty. Your own ~/.config/kitty/kitty.conf, if
# you create one, is used instead of this file.

# See-through glass: Hyprland blurs whatever is behind the window, so the
# wallpaper shows through softly while text stays readable. 1.0 = solid.
background_opacity 0.85
# Ctrl+Shift+A then M / L makes the current window more / less see-through.
dynamic_background_opacity yes
