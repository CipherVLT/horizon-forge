# Bazzite Horizon launcher (fuzzel, Super+D): Bazzite Horizon's colors, the
# amber of the window borders on dark grey. Your own
# ~/.config/fuzzel/fuzzel.ini, if you make one, is used instead.
# Reference: man fuzzel.ini
[main]
terminal=kitty -e
prompt="❯ "
width=40
lines=12
horizontal-pad=16
vertical-pad=12
inner-pad=6

[colors]
background=1a1c18e6
text=e3e3dcff
prompt=e4a15aff
input=e3e3dcff
match=e4a15aff
selection=2c3038ff
selection-text=e3e3dcff
selection-match=e4a15aff
border=e4a15aee

[border]
width=2
radius=8
