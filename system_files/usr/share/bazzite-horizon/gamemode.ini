; Bazzite Horizon GameMode defaults.
; build.sh installs this as /usr/share/gamemode/gamemode.ini, so image
; updates replace it. Personal overrides go in ~/.config/gamemode.ini
; (or /etc/gamemode.ini for the whole machine); those win over this file.
;
; Games use GameMode when launched with `gamemoderun`. In Steam, set the
; game's Launch Options to:   gamemoderun %command%
; Lutris and Heroic have a GameMode toggle in their settings.

[general]
reaper_freq=5

; CPU governor while a game runs. With amd-pstate / intel_pstate in active
; mode this also sets the energy-performance hint to "performance", which
; stops clocks from dropping between frames. The previous governor is
; restored when the last game exits.
desiredgov=performance

; ACPI platform profile (laptops: fan curve and power limits).
desiredprof=performance

; On APUs, hand power back to the integrated GPU when it is the bottleneck.
igpu_desiredgov=powersave
igpu_power_threshold=0.3

softrealtime=off
inhibit_screensaver=1

[custom]
; Switch the tuned power profile (balanced -> performance) for the game,
; then put the user's previous choice back.
start=/usr/libexec/bazzite-horizon-gamemode-power start
end=/usr/libexec/bazzite-horizon-gamemode-power end
script_timeout=10
