# Seeded once by /usr/bin/event-horizon-session.
# Later logins keep your edits. Move this file aside to reseed.
# Color matching: Event Horizon rewrites ~/.config/hypr/eh/colors.conf
# when you pick a wallpaper (see upstream Docs/Setup.md).

source = ~/.config/hypr/eh/colors.conf
# NVIDIA / hybrid-GPU environment, regenerated at every login. Do not edit
# gpu.conf; put overrides below this line instead.
source = ~/.config/hypr/eh/gpu.conf

monitor=,preferred,auto,auto

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland,x11
env = ELECTRON_OZONE_PLATFORM_HINT,auto

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

general {
    gaps_in = 4
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(e4a15aee)
    col.inactive_border = rgba(2c3038aa)
    layout = dwindle
}

decoration {
    rounding = 10
}

animations {
    enabled = true
}

dwindle {
    # pseudotile was removed in Hyprland 0.54; pseudo windows are toggled
    # per window with the pseudo dispatcher (SUPER+P below).
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = EventHorizon

bind = SUPER, Return, exec, kitty
bind = SUPER, Q, killactive
bind = SUPER, M, exit
bind = SUPER, F, fullscreen, 0
bind = SUPER, Space, exec, fuzzel
bind = SUPER, V, togglefloating
bind = SUPER, P, pseudo
# togglesplit is a layout message since Hyprland 0.54, not a dispatcher.
bind = SUPER, T, layoutmsg, togglesplit

bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
